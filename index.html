<!DOCTYPE html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Virtuelles Haustier-Spiel: sammeln, pflegen, entwickeln — komplett im Browser, ohne Installation." />
    <title>Fabelgarten — Virtuelles Haustier-Spiel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/animations.css" />
  </head>
  <body>
    <!-- Ladehinweis: wird durch die App ersetzt, sobald sie gestartet ist. -->
    <div id="boot" class="boot">
      <div class="boot__mark" aria-hidden="true">🐾</div>
      <p class="boot__text">Fabelgarten wird geladen …</p>
      <noscript>
        <p class="boot__text">Dieses Spiel benötigt JavaScript. Bitte aktiviere es in deinem Browser.</p>
      </noscript>
    </div>

    <!--
      Scheitert der Start, bleibt sonst nur der Ladehinweis stehen und niemand
      erfährt, woran es lag. Dieser Melder steht bewusst vor dem Spiel-Bündel:
      So fängt er auch einen Syntaxfehler ab, bei dem das Bündel selbst gar
      nicht erst ausgeführt wird. Die Gestaltung liegt inline, weil in so einem
      Fall auch das Stylesheet fehlen kann.
    -->
    <script>
      (function () {
        var gemeldet = false;
        function zeigeFehler(text) {
          if (gemeldet) return;
          gemeldet = true;
          var ziel = document.getElementById('boot');
          if (!ziel) return;
          ziel.textContent = '';
          var titel = document.createElement('p');
          titel.textContent = 'Das Spiel konnte nicht starten.';
          titel.style.cssText = 'font:600 16px/1.5 system-ui,sans-serif;margin:0 0 .75rem';
          var kasten = document.createElement('pre');
          kasten.textContent = text;
          kasten.style.cssText =
            'white-space:pre-wrap;word-break:break-word;max-width:34rem;margin:0 auto;' +
            'padding:.75rem;border:1px solid currentColor;border-radius:8px;text-align:left;' +
            'font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace';
          ziel.appendChild(titel);
          ziel.appendChild(kasten);
        }
        window.addEventListener('error', function (e) {
          zeigeFehler((e.message || 'Unbekannter Fehler') + '\n' + (e.filename || '') + ':' + (e.lineno || '?'));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var grund = e.reason;
          zeigeFehler('Unbehandelte Zusage: ' + ((grund && grund.message) || grund));
        });
      })();
    </script>

    <div id="app" class="app" hidden></div>
    <div id="modal-root" class="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
    <div id="fx-root" class="fx-root" aria-hidden="true"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
