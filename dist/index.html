  <style>
/* ---- src/styles/base.css ---- */
/* ==========================================================================
   base.css — Reset, Design-Tokens, Themes, Grundtypografie
   ========================================================================== */

/* --- Reset ---------------------------------------------------------------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

* {
  margin: 0;
}

html,
body {
  height: 100%;
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  color: var(--text);
  background: var(--bg);
  overscroll-behavior: none;
}

img,
svg,
canvas {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}

/* --- Design-Tokens -------------------------------------------------------- */

:root {
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-display: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;

  /* Abstände (4-px-Raster) */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;
  --sp-7: 3rem;

  /* Radien */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* Bewegung */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 140ms;
  --t-med: 260ms;
  --t-slow: 460ms;

  /* Element-Farben (themeunabhängig, sie sind Teil der Spielidentität) */
  --el-feuer: #ff7a45;
  --el-wasser: #38b6ff;
  --el-natur: #4cc38a;
  --el-blitz: #ffc93c;
  --el-eis: #7fd8e8;
  --el-schatten: #8b6bd9;
  --el-licht: #ffd98e;
  --el-gestein: #b08968;
  --el-wind: #9ad9c8;
  --el-metall: #a9b4c2;
  --el-geist: #d67ab1;
  --el-kristall: #7ae5d0;

  /* Seltenheits-Farben */
  --ra-gewoehnlich: #b6bfcc;
  --ra-ungewoehnlich: #55c57a;
  --ra-selten: #4aa8ff;
  --ra-episch: #b072f5;
  --ra-legendaer: #ffc03a;
  --ra-mystisch: #ff5a7a;

  /* Bedürfnis-Farben */
  --stat-gesundheit: #ff6b7d;
  --stat-energie: #ffc93c;
  --stat-hunger: #ffa552;
  --stat-durst: #4aa8ff;
  --stat-sauberkeit: #7ae5d0;
  --stat-stimmung: #ff8fc7;

  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.14);
  --shadow-md: 0 6px 18px -6px rgb(0 0 0 / 0.28);
  --shadow-lg: 0 20px 48px -20px rgb(0 0 0 / 0.45);
}

/* --- Dunkles Theme (Standard) --------------------------------------------- */

:root,
:root[data-theme='dark'] {
  --bg: #0e1220;
  --bg-deep: #070a14;
  --surface: #171d31;
  --surface-2: #1f2740;
  --surface-3: #2a3350;
  --border: #2e3859;
  --border-soft: #232c47;

  --text: #eaeefb;
  --text-dim: #a7b1cd;
  --text-faint: #6f7a99;

  --brand: #7c8cff;
  --brand-strong: #9aa6ff;
  --brand-ink: #0e1220;
  --accent: #ffc93c;

  --good: #4cc38a;
  --warn: #ffb020;
  --bad: #ff6b7d;

  --focus: #9aa6ff;

  --scene-sky-1: #1b2144;
  --scene-sky-2: #2a2d5c;
  --scene-ground: #1d2a3f;
  --glass: rgb(255 255 255 / 0.06);
  --glass-line: rgb(255 255 255 / 0.09);
}

/* --- Helles Theme --------------------------------------------------------- */

:root[data-theme='light'] {
  --bg: #f3f5fb;
  --bg-deep: #e7ebf6;
  --surface: #ffffff;
  --surface-2: #f5f7fd;
  --surface-3: #e9eefa;
  --border: #d7deee;
  --border-soft: #e6ebf7;

  --text: #182034;
  --text-dim: #55617e;
  --text-faint: #8b95af;

  --brand: #5566f0;
  --brand-strong: #4353e0;
  --brand-ink: #ffffff;
  --accent: #f0a416;

  --good: #22a06b;
  --warn: #d98200;
  --bad: #e0455c;

  --focus: #4353e0;

  --scene-sky-1: #cfe3ff;
  --scene-sky-2: #eadcff;
  --scene-ground: #d5ecd8;
  --glass: rgb(18 24 40 / 0.04);
  --glass-line: rgb(18 24 40 / 0.08);

  --shadow-md: 0 6px 18px -8px rgb(30 45 90 / 0.22);
  --shadow-lg: 0 20px 48px -22px rgb(30 45 90 / 0.32);
}

/* --- Typografie ----------------------------------------------------------- */

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.01em;
}

h1 {
  font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem);
}
h2 {
  font-size: clamp(1.2rem, 1rem + 0.9vw, 1.55rem);
}
h3 {
  font-size: 1.05rem;
}

p {
  text-wrap: pretty;
}

.muted {
  color: var(--text-dim);
}
.faint {
  color: var(--text-faint);
}
.tiny {
  font-size: 0.78rem;
}
.small {
  font-size: 0.86rem;
}
.center {
  text-align: center;
}
.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* --- Ladebildschirm ------------------------------------------------------- */

.boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: var(--sp-4);
  background: var(--bg);
  z-index: 100;
}

.boot__mark {
  font-size: 3.5rem;
  animation: boot-pulse 1.4s var(--ease-out) infinite;
}

.boot__text {
  color: var(--text-dim);
}

@keyframes boot-pulse {
  0%,
  100% {
    transform: scale(1) rotate(-4deg);
    opacity: 0.7;
  }
  50% {
    transform: scale(1.14) rotate(4deg);
    opacity: 1;
  }
}

/* --- Scrollbars ----------------------------------------------------------- */

* {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: var(--r-pill);
  border: 3px solid transparent;
  background-clip: content-box;
}

/* ---- src/styles/layout.css ---- */
/* ==========================================================================
   layout.css — App-Gerüst, Navigation, Bildschirmraster, Responsivität
   ========================================================================== */

/* --- Grundregel gegen waagerechtes Scrollen ------------------------------- */

/*
   Grid- und Flex-Kinder haben von sich aus `min-width: auto` und schrumpfen
   deshalb nie unter ihren Inhalt. Ein einziges breites Element (eine
   Navigationsbeschriftung, eine lange Zahl) würde so die ganze Seite über den
   Bildschirmrand schieben. Diese Regel nimmt dem Layout genau diese Falle.
*/
.app,
.app *:not(canvas):not(svg) {
  min-width: 0;
}

.app {
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    'topbar'
    'screen'
    'nav';
  /* Letzte Sicherung: nichts darf die Seite waagerecht aufziehen. */
  overflow-x: clip;
  max-width: 100%;
  background:
    radial-gradient(120% 80% at 12% -10%, var(--scene-sky-2) 0%, transparent 55%),
    radial-gradient(100% 70% at 90% 0%, var(--scene-sky-1) 0%, transparent 50%),
    var(--bg);
}

/* --- Kopfleiste ----------------------------------------------------------- */

.topbar {
  grid-area: topbar;
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  padding-top: max(var(--sp-3), env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.topbar__brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
}

.topbar__brand span[aria-hidden] {
  font-size: 1.3rem;
  flex: none;
}

/* Auf sehr schmalen Geräten bleibt nur das Zeichen — der Platz gehört den Werten. */
@media (max-width: 380px) {
  .topbar__brand span:not([aria-hidden]) {
    display: none;
  }
}

.topbar__spacer {
  flex: 1;
}

.topbar__wallet {
  display: flex;
  gap: var(--sp-2);
  flex: none;
}

/* --- Bildschirmfläche ----------------------------------------------------- */

.screen {
  grid-area: screen;
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding: var(--sp-4);
  padding-bottom: var(--sp-6);
  padding-inline: max(var(--sp-4), env(safe-area-inset-left), env(safe-area-inset-right));
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  animation: screen-in var(--t-med) var(--ease-out);
}

.screen__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
}

.screen__title {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* --- Navigation ----------------------------------------------------------- */

.nav {
  grid-area: nav;
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  gap: var(--sp-1);
  padding: var(--sp-2);
  padding-bottom: max(var(--sp-2), env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border-soft);
}

.nav__item {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  /* Mindestens 44 px hoch: bequem mit dem Daumen zu treffen. */
  min-height: 48px;
  padding: var(--sp-2) 2px;
  border-radius: var(--r-md);
  color: var(--text-faint);
  font-size: 0.68rem;
  font-weight: 600;
  transition: color var(--t-fast), background var(--t-fast), transform var(--t-fast);
  position: relative;
}

/* Beschriftungen kürzen statt die Leiste zu verbreitern. */
.nav__item > span:not(.nav__icon):not(.nav__badge) {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav__item:hover {
  color: var(--text-dim);
  background: var(--glass);
}

.nav__item:active {
  transform: scale(0.94);
}

.nav__item[aria-current='page'] {
  color: var(--brand-strong);
  background: color-mix(in srgb, var(--brand) 16%, transparent);
}

.nav__icon {
  font-size: 1.25rem;
  line-height: 1;
}

.nav__badge {
  position: absolute;
  top: 4px;
  right: 50%;
  translate: 18px 0;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: var(--r-pill);
  background: var(--bad);
  color: #fff;
  font-size: 0.62rem;
  font-weight: 800;
  display: grid;
  place-items: center;
}

/* --- Desktop: Seitenleiste statt Bodenleiste ------------------------------ */

@media (min-width: 900px) {
  .app {
    grid-template-columns: 232px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      'nav topbar'
      'nav screen';
  }

  .nav {
    flex-direction: column;
    gap: 2px;
    padding: var(--sp-4) var(--sp-3);
    border-top: none;
    border-right: 1px solid var(--border-soft);
    overflow-y: auto;
    max-height: 100dvh;
    position: sticky;
    top: 0;
    bottom: auto;
  }

  .nav__item {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: var(--sp-3);
    padding: var(--sp-3);
    font-size: 0.92rem;
  }

  .nav__icon {
    font-size: 1.15rem;
    width: 1.4rem;
    text-align: center;
  }

  .nav__badge {
    position: static;
    translate: none;
    margin-left: auto;
  }

  .screen {
    padding: var(--sp-5);
  }
}

/* --- Raster --------------------------------------------------------------- */

.grid {
  display: grid;
  gap: var(--sp-3);
}

/*
   `min(… , 100%)` statt einer festen Mindestbreite: dadurch kippt das Raster
   auf schmalen Geräten sauber auf eine Spalte, statt über den Rand zu laufen.
*/
.grid--auto {
  grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr));
}

.grid--wide {
  grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr));
}

.grid--tiles {
  grid-template-columns: repeat(auto-fill, minmax(min(96px, 100%), 1fr));
}

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

.row--tight {
  gap: var(--sp-1);
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.spread {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
}

/* --- Haupt-Bühne (Zuhause-Bildschirm) ------------------------------------- */

.stage {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1px solid var(--glass-line);
  background: linear-gradient(180deg, var(--scene-sky-1), var(--scene-sky-2) 62%, var(--scene-ground));
  min-height: clamp(260px, 42dvh, 380px);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-lg);
}

@media (min-width: 900px) {
  .home-layout {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: var(--sp-4);
    align-items: start;
  }
}

/* --- Tablet-Zwischenstufe -------------------------------------------------- */

@media (min-width: 640px) and (max-width: 899px) {
  .screen {
    padding: var(--sp-5);
  }

  /* Auf dem Tablet passen Bedürfnisse und Gefühle nebeneinander. */
  .home-layout > .col:last-child {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--sp-3);
    align-items: start;
  }

  .stage {
    min-height: clamp(300px, 38dvh, 420px);
  }
}

/* --- Waagerecht scrollende Behälter --------------------------------------- */

/*
   Alles, was breiter werden darf als der Bildschirm, scrollt in sich selbst.
   Die Seite bleibt dadurch immer genau so breit wie das Fenster.
*/
.scroll-x {
  overflow-x: auto;
  overflow-y: hidden;
  flex-wrap: nowrap;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}

.scroll-x > * {
  flex: none;
}

@keyframes screen-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---- src/styles/components.css ---- */
/* ==========================================================================
   components.css — Karten, Knöpfe, Leisten, Dialoge, Chips, Kacheln
   ========================================================================== */

/* --- Karten --------------------------------------------------------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-sm);
}

.card--flush {
  padding: 0;
  overflow: hidden;
}

.card--glass {
  background: var(--glass);
  border-color: var(--glass-line);
  backdrop-filter: blur(10px);
}

.card__title {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.section-label {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* --- Knöpfe --------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.62rem 1.05rem;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 650;
  font-size: 0.92rem;
  white-space: nowrap;
  transition: transform var(--t-fast) var(--ease-spring), background var(--t-fast),
    border-color var(--t-fast), opacity var(--t-fast);
}

.btn:hover:not(:disabled) {
  background: var(--surface-3);
  border-color: var(--brand);
}

.btn:active:not(:disabled) {
  transform: scale(0.95);
}

.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.btn--primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-strong));
  border-color: transparent;
  color: var(--brand-ink);
  box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--brand) 80%, transparent);
}

.btn--primary:hover:not(:disabled) {
  filter: brightness(1.08);
  background: linear-gradient(135deg, var(--brand), var(--brand-strong));
}

.btn--ghost {
  background: transparent;
  border-color: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--glass);
  border-color: var(--glass-line);
}

.btn--danger {
  border-color: color-mix(in srgb, var(--bad) 55%, transparent);
  color: var(--bad);
}

.btn--danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--bad) 14%, transparent);
  border-color: var(--bad);
}

.btn--block {
  width: 100%;
}

.btn--sm {
  padding: 0.4rem 0.75rem;
  font-size: 0.82rem;
}

/*
   Auf Geräten ohne Maus bekommt jedes Bedienelement mindestens 44 px Höhe —
   die Größe, die sich mit dem Daumen zuverlässig treffen lässt.
*/
@media (pointer: coarse) {
  .btn,
  .tab,
  .list-item button,
  .switch {
    min-height: 44px;
  }

  .btn--icon {
    min-width: 44px;
  }

  .action {
    min-height: 72px;
  }

  .tile {
    min-height: 64px;
  }
}

.btn--icon {
  padding: 0.5rem;
  aspect-ratio: 1;
  border-radius: var(--r-pill);
}

/* --- Aktionsknöpfe (Zuhause) ---------------------------------------------- */

.action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: var(--sp-2);
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: var(--sp-3) var(--sp-1);
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  font-size: 0.72rem;
  font-weight: 650;
  color: var(--text-dim);
  transition: transform var(--t-fast) var(--ease-spring), background var(--t-fast),
    color var(--t-fast), border-color var(--t-fast);
}

.action:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--text);
  border-color: var(--brand);
  transform: translateY(-2px);
}

.action:active:not(:disabled) {
  transform: scale(0.93);
}

.action:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.action__icon {
  font-size: 1.5rem;
  line-height: 1;
}

/* --- Chips & Abzeichen ---------------------------------------------------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0.22rem 0.62rem;
  border-radius: var(--r-pill);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  font-size: 0.76rem;
  font-weight: 650;
  white-space: nowrap;
}

.chip--wallet {
  background: var(--surface-2);
  border-color: var(--border-soft);
  font-variant-numeric: tabular-nums;
}

.chip--el {
  color: var(--el-color, var(--text));
  border-color: color-mix(in srgb, var(--el-color, var(--brand)) 40%, transparent);
  background: color-mix(in srgb, var(--el-color, var(--brand)) 14%, transparent);
}

.chip--rarity {
  color: var(--ra-color, var(--text));
  border-color: color-mix(in srgb, var(--ra-color, var(--brand)) 45%, transparent);
  background: color-mix(in srgb, var(--ra-color, var(--brand)) 15%, transparent);
}

/* Seltenheits-Farbe als Variable setzen (von JS über data-rarity gesetzt) */
[data-rarity='gewoehnlich'] { --ra-color: var(--ra-gewoehnlich); }
[data-rarity='ungewoehnlich'] { --ra-color: var(--ra-ungewoehnlich); }
[data-rarity='selten'] { --ra-color: var(--ra-selten); }
[data-rarity='episch'] { --ra-color: var(--ra-episch); }
[data-rarity='legendaer'] { --ra-color: var(--ra-legendaer); }
[data-rarity='mystisch'] { --ra-color: var(--ra-mystisch); }

[data-element='feuer'] { --el-color: var(--el-feuer); }
[data-element='wasser'] { --el-color: var(--el-wasser); }
[data-element='natur'] { --el-color: var(--el-natur); }
[data-element='blitz'] { --el-color: var(--el-blitz); }
[data-element='eis'] { --el-color: var(--el-eis); }
[data-element='schatten'] { --el-color: var(--el-schatten); }
[data-element='licht'] { --el-color: var(--el-licht); }
[data-element='gestein'] { --el-color: var(--el-gestein); }
[data-element='wind'] { --el-color: var(--el-wind); }
[data-element='metall'] { --el-color: var(--el-metall); }
[data-element='geist'] { --el-color: var(--el-geist); }
[data-element='kristall'] { --el-color: var(--el-kristall); }

/* --- Werteleisten --------------------------------------------------------- */

.stat {
  display: grid;
  grid-template-columns: 1.15rem 1fr auto;
  align-items: center;
  gap: var(--sp-2);
  font-size: 0.8rem;
}

.stat__icon {
  text-align: center;
}

.stat__track {
  height: 9px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
  position: relative;
}

.stat__fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--stat-color, var(--brand));
  transition: width var(--t-slow) var(--ease-out), background var(--t-med);
  position: relative;
}

.stat__fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgb(255 255 255 / 0.28), transparent 60%);
}

.stat__value {
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  min-width: 2.4rem;
  text-align: right;
}

.stat--low .stat__fill {
  animation: stat-warn 1.6s ease-in-out infinite;
}

/* Attributwerte (Stärke, Intelligenz …) */
.attr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
  gap: var(--sp-2);
}

.attr {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: var(--sp-2);
  text-align: center;
}

.attr__value {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.attr__label {
  font-size: 0.68rem;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* --- Fortschrittsbalken (XP, Brutzeit, Expedition) ------------------------ */

.progress {
  height: 7px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.progress__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand), var(--accent));
  border-radius: var(--r-pill);
  transition: width var(--t-slow) var(--ease-out);
}

/* --- Haustier-Karten ------------------------------------------------------ */

.pet-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  text-align: left;
  transition: transform var(--t-fast) var(--ease-spring), border-color var(--t-fast),
    box-shadow var(--t-fast);
  overflow: hidden;
}

.pet-card::before {
  content: '';
  position: absolute;
  inset: -40% 40% 60% -40%;
  background: radial-gradient(circle, color-mix(in srgb, var(--ra-color, var(--brand)) 40%, transparent), transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}

.pet-card:hover {
  transform: translateY(-3px);
  border-color: var(--ra-color, var(--brand));
  box-shadow: var(--shadow-md);
}

.pet-card--active {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 45%, transparent);
}

.pet-card__art {
  height: 92px;
  display: grid;
  place-items: center;
  position: relative;
}

.pet-card__name {
  font-weight: 700;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  gap: 4px;
  /* Lange Namen kürzen, statt sie aus der Karte laufen zu lassen. */
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.pet-card__name > * {
  flex: none;
}

.pet-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-1);
  font-size: 0.74rem;
  color: var(--text-faint);
}

.pet-card__fav {
  position: absolute;
  top: var(--sp-2);
  right: var(--sp-2);
  font-size: 0.9rem;
}

/* --- Sprite-Hülle --------------------------------------------------------- */

.sprite {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  position: relative;
}

.sprite svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.sprite--stage {
  width: min(62%, 260px);
  aspect-ratio: 1;
}

/* --- Item-Kacheln --------------------------------------------------------- */

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: var(--sp-3) var(--sp-2);
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  transition: transform var(--t-fast) var(--ease-spring), border-color var(--t-fast);
  text-align: center;
}

.tile:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: var(--ra-color, var(--brand));
}

.tile:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.tile__icon {
  font-size: 1.7rem;
  line-height: 1;
}

.tile__label {
  font-size: 0.72rem;
  font-weight: 650;
  line-height: 1.25;
}

.tile__count {
  position: absolute;
  top: 4px;
  right: 6px;
  font-size: 0.68rem;
  font-weight: 800;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.tile--locked {
  filter: grayscale(1);
  opacity: 0.5;
}

/* --- Dialoge -------------------------------------------------------------- */

.modal-root:empty {
  display: none;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: var(--sp-4);
  background: rgb(4 6 14 / 0.62);
  backdrop-filter: blur(6px);
  animation: fade-in var(--t-fast) ease-out;
}

.modal {
  width: min(560px, 100%);
  max-height: min(84dvh, 720px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-5);
  box-shadow: var(--shadow-lg);
  animation: modal-in var(--t-med) var(--ease-spring);
}

.modal__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.modal__body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.modal__foot {
  display: flex;
  gap: var(--sp-2);
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: var(--sp-4);
}

/* --- Hinweise (Toasts) ---------------------------------------------------- */

.toast-root {
  position: fixed;
  left: 50%;
  translate: -50% 0;
  bottom: calc(84px + env(safe-area-inset-bottom));
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  pointer-events: none;
  width: min(440px, calc(100% - 2rem));
}

@media (min-width: 900px) {
  .toast-root {
    bottom: var(--sp-5);
  }
}

.toast {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 0.6rem 1rem;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  font-size: 0.88rem;
  font-weight: 600;
  animation: toast-in var(--t-med) var(--ease-spring);
  max-width: 100%;
}

.toast--good {
  border-color: color-mix(in srgb, var(--good) 55%, transparent);
}
.toast--bad {
  border-color: color-mix(in srgb, var(--bad) 55%, transparent);
}
.toast--rare {
  border-color: var(--ra-legendaer);
  box-shadow: 0 0 24px -6px var(--ra-legendaer);
}

.toast--leaving {
  animation: toast-out var(--t-med) var(--ease-out) forwards;
}

/* --- Effekt-Ebene --------------------------------------------------------- */

.fx-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 80;
  overflow: hidden;
}

.fx-float {
  position: absolute;
  font-weight: 800;
  font-size: 1rem;
  text-shadow: 0 2px 6px rgb(0 0 0 / 0.45);
  animation: float-up 1.1s var(--ease-out) forwards;
  white-space: nowrap;
}

.fx-particle {
  position: absolute;
  font-size: 1.1rem;
  animation: particle-burst 0.9s var(--ease-out) forwards;
}

/* --- Reiter --------------------------------------------------------------- */

.tabs {
  display: flex;
  gap: var(--sp-1);
  padding: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-pill);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: 1 0 auto;
  padding: 0.42rem 0.9rem;
  border-radius: var(--r-pill);
  font-size: 0.84rem;
  font-weight: 650;
  color: var(--text-dim);
  white-space: nowrap;
  transition: background var(--t-fast), color var(--t-fast);
}

.tab[aria-selected='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* --- Formularelemente ----------------------------------------------------- */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.field__label {
  font-size: 0.8rem;
  font-weight: 650;
  color: var(--text-dim);
}

.input,
.select {
  padding: 0.55rem 0.8rem;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border);
  transition: border-color var(--t-fast);
  width: 100%;
}

.input:focus,
.select:focus {
  border-color: var(--brand);
  outline: none;
}

.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--border-soft);
  width: 100%;
  text-align: left;
}

.switch:last-child {
  border-bottom: none;
}

.switch__track {
  flex: none;
  width: 46px;
  height: 26px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--border);
  position: relative;
  transition: background var(--t-fast);
}

.switch__track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: transform var(--t-med) var(--ease-spring), background var(--t-fast);
}

.switch[aria-checked='true'] .switch__track {
  background: color-mix(in srgb, var(--brand) 45%, transparent);
  border-color: var(--brand);
}

.switch[aria-checked='true'] .switch__track::after {
  transform: translateX(20px);
  background: var(--brand-strong);
}

/* --- Leerzustände --------------------------------------------------------- */

.empty {
  display: grid;
  place-items: center;
  gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--text-faint);
}

.empty__icon {
  font-size: 2.5rem;
  opacity: 0.6;
}

/* --- Listeneinträge ------------------------------------------------------- */

.list-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  width: 100%;
  text-align: left;
}

.list-item__icon {
  font-size: 1.5rem;
  flex: none;
  width: 2rem;
  text-align: center;
}

.list-item__body {
  flex: 1;
  min-width: 0;
}

.list-item__title {
  font-weight: 650;
  font-size: 0.92rem;
}

.list-item--done {
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
  background: color-mix(in srgb, var(--good) 10%, var(--surface-2));
}

.list-item--locked {
  opacity: 0.55;
}

/* ---- src/styles/animations.css ---- */
/* ==========================================================================
   animations.css — Keyframes und Haustier-Animationszustände
   ==========================================================================
   Die Sprites (prozedural wie handgezeichnet) liefern immer dieselben
   Gruppen-Klassen: .pet-root, .pet-body, .pet-head, .pet-eye, .pet-tail,
   .pet-ear, .pet-wing, .pet-aura. Dadurch gelten diese Animationen für
   jede Kreatur, unabhängig von ihrer Herkunft.
   ========================================================================== */

/* --- Allgemeine Keyframes ------------------------------------------------- */

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes modal-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.94);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes toast-out {
  to {
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
  }
}

@keyframes float-up {
  0% {
    opacity: 0;
    transform: translateY(0) scale(0.7);
  }
  18% {
    opacity: 1;
    transform: translateY(-10px) scale(1.12);
  }
  100% {
    opacity: 0;
    transform: translateY(-72px) scale(1);
  }
}

@keyframes particle-burst {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(0.5) rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: translate(var(--dx, 0), var(--dy, -60px)) scale(1.15) rotate(var(--dr, 180deg));
  }
}

@keyframes stat-warn {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.55);
  }
}

@keyframes shimmer {
  0% {
    background-position: -180% 0;
  }
  100% {
    background-position: 180% 0;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin-slow {
  to {
    transform: rotate(360deg);
  }
}

/* --- Grundbewegung des Sprites -------------------------------------------- */

.pet-root {
  transform-box: fill-box;
  transform-origin: center bottom;
}

.sprite--animated .pet-root {
  animation: pet-breathe 3.4s ease-in-out infinite;
}

@keyframes pet-breathe {
  0%,
  100% {
    transform: scaleY(1) translateY(0);
  }
  50% {
    transform: scaleY(1.035) translateY(-1.5%);
  }
}

.sprite--animated .pet-tail {
  transform-box: fill-box;
  transform-origin: left center;
  animation: pet-tail 2.1s ease-in-out infinite;
}

@keyframes pet-tail {
  0%,
  100% {
    transform: rotate(-7deg);
  }
  50% {
    transform: rotate(9deg);
  }
}

.sprite--animated .pet-ear {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: pet-ear 4.2s ease-in-out infinite;
}

@keyframes pet-ear {
  0%,
  92%,
  100% {
    transform: rotate(0deg);
  }
  95% {
    transform: rotate(-8deg);
  }
}

.sprite--animated .pet-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-blink 5.2s ease-in-out infinite;
}

@keyframes pet-blink {
  0%,
  94%,
  100% {
    transform: scaleY(1);
  }
  96% {
    transform: scaleY(0.08);
  }
}

.sprite--animated .pet-wing {
  transform-box: fill-box;
  transform-origin: right center;
  animation: pet-wing 1.5s ease-in-out infinite;
}

@keyframes pet-wing {
  0%,
  100% {
    transform: rotate(0deg) scaleX(1);
  }
  50% {
    transform: rotate(-16deg) scaleX(0.88);
  }
}

.pet-aura {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-aura 4s ease-in-out infinite;
}

@keyframes pet-aura {
  0%,
  100% {
    opacity: 0.35;
    transform: scale(1);
  }
  50% {
    opacity: 0.7;
    transform: scale(1.07);
  }
}

.pet-orbit {
  transform-box: view-box;
  transform-origin: 50% 50%;
  animation: spin-slow 9s linear infinite;
}

.pet-float {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-float 3s ease-in-out infinite;
}

@keyframes pet-float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-4%);
  }
}

/* --- Zustände ------------------------------------------------------------- */

.sprite[data-mood='schlafend'] .pet-root {
  animation: pet-sleep 4.2s ease-in-out infinite;
}

.sprite[data-mood='schlafend'] .pet-eye {
  animation: none;
  transform: scaleY(0.1);
}

@keyframes pet-sleep {
  0%,
  100% {
    transform: scale(1, 0.98) translateY(1%) rotate(-1deg);
  }
  50% {
    transform: scale(1.02, 1.01) translateY(-0.5%) rotate(1deg);
  }
}

.sprite[data-mood='krank'] .pet-root {
  filter: saturate(0.5) brightness(0.88);
  animation: pet-sick 2.4s ease-in-out infinite;
}

@keyframes pet-sick {
  0%,
  100% {
    transform: translateY(0) rotate(0deg);
  }
  25% {
    transform: translateY(1.5%) rotate(-1.5deg);
  }
  75% {
    transform: translateY(1.5%) rotate(1.5deg);
  }
}

.sprite[data-mood='traurig'] .pet-root {
  animation: pet-sad 3.6s ease-in-out infinite;
}

@keyframes pet-sad {
  0%,
  100% {
    transform: translateY(2%) scaleY(0.97);
  }
  50% {
    transform: translateY(3%) scaleY(0.95);
  }
}

.sprite[data-mood='begeistert'] .pet-root {
  animation: pet-hop 0.85s var(--ease-spring) infinite;
}

@keyframes pet-hop {
  0%,
  100% {
    transform: translateY(0) scaleY(1);
  }
  30% {
    transform: translateY(-9%) scaleY(1.05);
  }
  55% {
    transform: translateY(0) scaleY(0.94);
  }
}

/* --- Einmalige Aktions-Animationen ---------------------------------------- */

.sprite--act-essen .pet-root {
  animation: act-eat 0.75s ease-in-out 2;
}

@keyframes act-eat {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  40% {
    transform: translateY(3%) rotate(-4deg) scaleY(0.94);
  }
  70% {
    transform: translateY(0) rotate(3deg);
  }
}

.sprite--act-spielen .pet-root {
  animation: act-play 0.6s var(--ease-spring) 3;
}

@keyframes act-play {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  25% {
    transform: translateY(-14%) rotate(-9deg);
  }
  60% {
    transform: translateY(-4%) rotate(8deg);
  }
}

.sprite--act-streicheln .pet-root {
  animation: act-pet 0.9s ease-in-out 2;
}

@keyframes act-pet {
  0%,
  100% {
    transform: rotate(0) scale(1);
  }
  30% {
    transform: rotate(-5deg) scale(1.04);
  }
  65% {
    transform: rotate(5deg) scale(1.04);
  }
}

.sprite--act-training .pet-root {
  animation: act-train 0.45s ease-in-out 4;
}

@keyframes act-train {
  0%,
  100% {
    transform: translateX(0);
  }
  30% {
    transform: translateX(-5%) scaleX(1.03);
  }
  70% {
    transform: translateX(5%) scaleX(0.97);
  }
}

.sprite--act-baden .pet-root {
  animation: act-bath 0.7s ease-in-out 3;
}

@keyframes act-bath {
  0%,
  100% {
    transform: rotate(0);
  }
  25% {
    transform: rotate(-12deg);
  }
  75% {
    transform: rotate(12deg);
  }
}

/* --- Entwicklung ---------------------------------------------------------- */

.evolve-stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 240px;
}

.evolve-stage .sprite {
  width: 200px;
  height: 200px;
}

.evolve-stage--flash .sprite {
  animation: evolve-flash 2.6s ease-in-out forwards;
}

@keyframes evolve-flash {
  0% {
    filter: brightness(1);
    transform: scale(1);
  }
  20% {
    filter: brightness(2.5) saturate(0);
    transform: scale(1.06);
  }

 * Seltenheitsverteilung des Eityps.

  const basis = speciesByRarity(rarityId, 'ei').filter((entry) => !entry.geheim && entry.stufe === 1);

  const beliebig = speciesByRarity(rarityId, 'ei').filter((entry) => !entry.geheim);

const BY_ID = new Map(SPECIES.map((entry) => [entry.id, entry]));

/** Art per ID. */
function species(id) {
  return BY_ID.get(id) || null;
}

/** Alle Arten (unveränderliche Sicht). */
function allSpecies() {
  return SPECIES;
}

/** Anzahl aller Arten — die Zielmarke fürs Haustierbuch. */
function speciesCount() {
  return SPECIES.length;
}

/** Alle Arten einer Entwicklungslinie, nach Stufe sortiert. */
function lineSpecies(lineId) {
  return SPECIES.filter((entry) => entry.linie === lineId).sort((a, b) => a.stufe - b.stufe);
}

/** Die drei Starter. */
function starterSpecies() {
  return SPECIES.filter((entry) => entry.starter);
}

/** Arten, die aus einer bestimmten Quelle stammen können. */
function speciesFromSource(source) {
  return SPECIES.filter((entry) => entry.quellen?.includes(source));
}

/** Arten einer Seltenheit, optional auf eine Quelle eingeschränkt. */
function speciesByRarity(rarityId, source = null) {
  return SPECIES.filter(
    (entry) => entry.rarity === rarityId && (!source || entry.quellen?.includes(source))
  );
}

/** Basisstufen einer Linie (Stufe 1) — daraus schlüpfen Eier. */
function baseStageSpecies(source = 'ei') {
  return SPECIES.filter(
    (entry) => entry.stufe === 1 && !entry.geheim && entry.quellen?.includes(source)
  );
}

/** Die Vorstufe einer Art, falls es eine gibt. */
function previousStage(id) {
  return SPECIES.find((entry) => entry.entwicklung?.some((step) => step.zu === id)) || null;
}

/** Vollständige Kette einer Linie als Liste von Listen (Verzweigungen bleiben sichtbar). */
function evolutionTree(lineId) {
  const members = lineSpecies(lineId);
  const roots = members.filter((entry) => !previousStage(entry.id));
  const build = (entry) => ({
    art: entry,
    weiter: (entry.entwicklung || []).map((step) => species(step.zu)).filter(Boolean).map(build),
  });
  return roots.map(build);
}

__exports["baseStageSpecies"] = baseStageSpecies;

__exports["evolutionTree"] = evolutionTree;

/**
 * inventory.js — Der Beutel.
 *
 * Gegenstände liegen als `{ id: Anzahl }` im Spielstand. Dieses Modul kümmert
 * sich ums Hinzufügen, Entfernen und um die Wirkung beim Benutzen.
 */

const { item, ITEM_LIST, OUTFIT_SLOTS } = __require("src/data/items.js");
const { species } = __require("src/data/species.js");
const { homeBonuses } = __require("src/data/rooms.js");
const { getState, update, petById } = __require("src/core/state.js");
const { emit, EVENTS } = __require("src/core/events.js");
const { clamp } = __require("src/core/util.js");
const { addCoins, addDiamonds } = __require("src/systems/economy.js");
const { grantXp } = __require("src/systems/pets.js");

/** Legt Gegenstände in den Beutel. */
function addItem(itemId, count = 1) {
  if (!item(itemId) || count <= 0) return 0;
  update((s) => {
    s.inventar[itemId] = (s.inventar[itemId] || 0) + count;
  });
  emit(EVENTS.ITEM_GAINED, { itemId, count });
  return count;
}

/** Mehrere Gegenstände auf einmal: `[{id, anzahl}]`. */
function addItems(list) {
  for (const entry of list) addItem(entry.id, entry.anzahl ?? 1);
}

/** Entfernt Gegenstände. @returns {boolean} ob genug vorhanden war */
function removeItem(itemId, count = 1) {
  const vorhanden = getState().inventar[itemId] || 0;
  if (vorhanden < count) return false;
  update((s) => {
    s.inventar[itemId] -= count;
    if (s.inventar[itemId] <= 0) delete s.inventar[itemId];
  });
  return true;
}

function itemCount(itemId) {
  return getState().inventar[itemId] || 0;
}

function hasItem(itemId, count = 1) {

}

/** Alle Gegenstände im Beutel als Liste mit Definition und Anzahl. */
function inventoryList(categoryId = null) {
  const inv = getState().inventar;
  return ITEM_LIST.filter((entry) => inv[entry.id] > 0)
    .filter((entry) => !categoryId || entry.kategorie === categoryId)
    .map((entry) => ({ ...entry, anzahl: inv[entry.id] }));
}

/** Gibt es im Beutel etwas aus dieser Kategorie? */
function hasCategory(categoryId) {
  return inventoryList(categoryId).length > 0;

/**
 * Benutzt einen Gegenstand an einem Haustier.
 *
 * @param {string} itemId
 * @param {string} petId
 * @returns {{ok:boolean, text?:string, effekte?:object, grund?:string}}

function useItem(itemId, petId) {
  const def = item(itemId);
  const pet = petById(petId);
  if (!def) return { ok: false, grund: 'Unbekannter Gegenstand.' };
  if (!pet && !def.spezial) return { ok: false, grund: 'Kein Haustier ausgewählt.' };
  if (!hasItem(itemId)) return { ok: false, grund: 'Nicht im Beutel.' };

  // Dauerhafte Gegenstände (Spielzeug, Bürste, Kleidung) werden nicht verbraucht.
  if (def.dauerhaft) {

    return { ok: false, grund: `${def.name} wirkt dauerhaft und muss nicht benutzt werden.` };
  }

  const boni = homeBonuses(getState().zuhause);
  const effekte = {};

  // Sonderfälle zuerst — sie verbrauchen den Gegenstand ebenfalls.
  if (def.spezial === 'muenzen') {
    removeItem(itemId);
    const menge = addCoins(def.wert || 100, 'goldbeutel');
    return { ok: true, text: `+${menge} Münzen`, effekte: { muenzen: menge } };
  }
  if (def.spezial === 'diamanten') {
    removeItem(itemId);
    const menge = addDiamonds(def.wert || 1, 'diamantsplitter');
    return { ok: true, text: `+${menge} Diamanten`, effekte: { diamanten: menge } };
  }
  if (def.spezial === 'xp') {
    removeItem(itemId);
    grantXp(petId, def.wert || 200);
    return { ok: true, text: `+${def.wert || 200} EP`, effekte: { xp: def.wert || 200 } };
  }

  if (!def.wirkung && !def.attribut) {
    return { ok: false, grund: `${def.name} wird an anderer Stelle verwendet.` };
  }

  removeItem(itemId);

  update((s) => {
    const ziel = s.haustiere.find((entry) => entry.id === petId);
    if (!ziel) return;

    const futterBonus = def.kategorie === 'futter' || def.kategorie === 'frucht' ? 1 + (boni.futterWirkung || 0) : 1;

    // Lieblingsessen wirkt stärker.

    for (const [key, value] of Object.entries(def.wirkung || {})) {
      const menge = value * futterBonus * heilBonus * passt;
      if (key in ziel.beduerfnisse) {

        effekte[key] = Math.round(menge);
      } else if (key in ziel.gefuehle) {
        ziel.gefuehle[key] = clamp(ziel.gefuehle[key] + menge, 0, 100);
        effekte[key] = Math.round(menge);
      }
    }

      effekte[key] = value;
    }

function equipOutfit(itemId, petId) {

  if (!hasItem(itemId)) return { ok: false, grund: 'Nicht im Beutel.' };

function clearOutfit(petId) {

function addCoins(amount, grund = '') {

  if (!menge) return 0;
  update((s) => {
    s.spieler.muenzen += menge;
    s.statistik.muenzenGesamt += menge;
  });
  emit(EVENTS.COINS_CHANGED, { delta: menge, grund });

}

 * @returns {boolean} ob genug vorhanden war
 */

}

function spendDiamonds(amount) {

  });

}

}

}

/**
 * quests.js — Tagesaufgaben.
 *
 * Die Aufgaben des Tages werden aus dem Datum gesät: Ein Neuladen ändert sie
 * nicht, ein neuer Tag schon. Fortschritt kommt über Ereignisse herein, die
 * Belohnung holt der Spieler bewusst ab.
 */

const { QUEST_TEMPLATES, QUESTS_PER_DAY, DAILY_BONUS, questTemplate } = __require("src/data/quests.js");
const { getState, update } = __require("src/core/state.js");
const { on, emit, EVENTS } = __require("src/core/events.js");
const { dayKey, clamp } = __require("src/core/util.js");
const { seededRandom, weightedPick, pick } = __require("src/core/rng.js");
const { addCoins, addDiamonds } = __require("src/systems/economy.js");
const { addItem } = __require("src/systems/inventory.js");
const { addEgg } = __require("src/systems/eggs.js");
const { activePet } = __require("src/core/state.js");
const { grantXp } = __require("src/systems/pets.js");

/** Stellt sicher, dass für heute Aufgaben existieren. */
function ensureTodaysQuests() {
  const heute = dayKey();
  const state = getState();
  if (state.aufgaben.tag === heute && state.aufgaben.liste?.length) return;

  const rand = seededRandom(`quests:${heute}`);
  const vorrat = [...QUEST_TEMPLATES];
  const gewaehlt = [];

  while (gewaehlt.length < QUESTS_PER_DAY && vorrat.length) {
    const eintrag = weightedPick(vorrat, rand);
    vorrat.splice(vorrat.indexOf(eintrag), 1);
    gewaehlt.push({
      vorlage: eintrag.id,
      ziel: pick(eintrag.ziele, rand),
      fortschritt: 0,
      abgeholt: false,
    });
  }

  update((s) => {
    s.aufgaben.tag = heute;
    s.aufgaben.liste = gewaehlt;
    s.aufgaben.minutenHeute = 0;
    s.aufgaben.bonusAbgeholt = false;
  });
}

/** Ist eine Aufgabe erfüllt? */
function isComplete(quest) {
  return quest.fortschritt >= quest.ziel;
}

/** Sind alle Aufgaben des Tages erledigt? */
function allComplete(state = getState()) {
  return state.aufgaben.liste?.length > 0 && state.aufgaben.liste.every(isComplete);
}

/** Anzahl abholbarer Belohnungen — für das Abzeichen in der Navigation. */
function claimableCount(state = getState()) {
  const offen = (state.aufgaben.liste || []).filter((q) => isComplete(q) && !q.abgeholt).length;
  const bonus = allComplete(state) && !state.aufgaben.bonusAbgeholt ? 1 : 0;
  return offen + bonus;
}

/**
 * Erhöht den Fortschritt eines Zählers.

function advanceQuest(zaehler, menge = 1) {

      quest.fortschritt = clamp(quest.fortschritt + menge, 0, quest.ziel);
      veraendert = true;
      if (isComplete(quest)) emit(EVENTS.QUEST_COMPLETED, { quest });

function claimQuest(index) {

  if (!isComplete(quest)) return { ok: false, grund: 'Noch nicht erledigt.' };
  if (quest.abgeholt) return { ok: false, grund: 'Bereits abgeholt.' };

  const vorlage = questTemplate(quest.vorlage);
  update((s) => {
    s.aufgaben.liste[index].abgeholt = true;
  });

/** Holt den Tagesbonus ab, wenn alle Aufgaben erledigt sind. */
function claimDailyBonus() {

  if (!allComplete(state)) return { ok: false, grund: 'Erst alle Aufgaben erledigen.' };
  if (state.aufgaben.bonusAbgeholt) return { ok: false, grund: 'Bereits abgeholt.' };

  update((s) => {
    s.aufgaben.bonusAbgeholt = true;
  });
  grantReward(DAILY_BONUS);
  return { ok: true, belohnung: DAILY_BONUS };
}

/** Verteilt eine Belohnung. */
function grantReward(belohnung) {
  if (!belohnung) return;
  if (belohnung.muenzen) addCoins(belohnung.muenzen, 'aufgabe');
  if (belohnung.diamanten) addDiamonds(belohnung.diamanten, 'aufgabe');
  if (belohnung.item) addItem(belohnung.item, 1);
  if (belohnung.ei) addEgg(belohnung.ei);
  if (belohnung.xp) {
    const pet = activePet();
    if (pet) grantXp(pet.id, belohnung.xp);
  }
}

/** Lesbare Belohnung für die Anzeige. */
function rewardText(belohnung) {
  const teile = [];
  if (belohnung.muenzen) teile.push(`${belohnung.muenzen} 🪙`);
  if (belohnung.diamanten) teile.push(`${belohnung.diamanten} 💎`);
  if (belohnung.xp) teile.push(`${belohnung.xp} EP`);
  if (belohnung.item) teile.push('1 Gegenstand');
  if (belohnung.ei) teile.push('1 Ei');
  return teile.join(' · ');

function installQuestSystem() {
  ensureTodaysQuests();

  on(EVENTS.DAY_ROLLOVER, ensureTodaysQuests);

  on(EVENTS.PET_ACTION, ({ actionId }) => {
    advanceQuest('aktionen');
    advanceQuest(actionId);
  });

  on(EVENTS.ITEM_USED, () => advanceQuest('gegenstaende'));
  on(EVENTS.EGG_HATCHED, () => advanceQuest('eier'));
  on(EVENTS.EXPEDITION_DONE, () => advanceQuest('expeditionen'));

  on(EVENTS.MINIGAME_FINISHED, ({ gewonnen }) => {
    advanceQuest('minispiele');
    if (gewonnen) advanceQuest('minispielSiege');
  });

  on(EVENTS.COINS_CHANGED, ({ delta }) => {
    if (delta > 0) advanceQuest('muenzen', delta);
  });

  // Spielzeit: einmal pro Minute nachziehen.
  let letzteMinute = 0;
  on(EVENTS.STATE_CHANGED, (s) => {

 *
 * Sechs Fragen, teils fest, teils aus der eigenen Sammlung erzeugt. Wer sein

 */

function createQuizGame(onEnd) {

  const entdeckt = Object.keys(state.buch).filter((id) => state.buch[id]?.gefangen);
  const fragen = buildQuizRound(FRAGEN, entdeckt);

  let index = 0;
  let richtig = 0;
  let gesperrt = false;

  const fortschritt = h('div.progress', h('div.progress__fill', { style: { width: '0%' } }));
  const frageText = h('h3.center');
  const antworten = h('div.col');

    fortschritt,
    h('div.card', frageText, h('div', { style: { height: '.75rem' } }), antworten)
  );

  function zeige() {
    if (index >= fragen.length) {
      onEnd({
        punkte: richtig * 20,
        gewonnen: richtig >= Math.ceil(FRAGEN * 0.7),
        detail: `${richtig} von ${fragen.length} richtig`,
      });
      return;
    }

    const frage = fragen[index];
    gesperrt = false;
    fortschritt.firstChild.style.width = `${(index / fragen.length) * 100}%`;
    replace(frageText, `${index + 1}. ${frage.frage}`);

    replace(
      antworten,
      ...frage.antworten.map((text, i) =>
        h(
          'button.btn.btn--block',
          {
            onclick: (event) => antworte(event.currentTarget, i, frage),
          },
          text
        )
      )
    );
  }

  function antworte(knopf, gewaehlt, frage) {
    if (gesperrt) return;
    gesperrt = true;

    const korrekt = gewaehlt === frage.richtig;
    if (korrekt) richtig += 1;

    // Richtige Antwort immer zeigen — daraus lernt man etwas.
    Array.from(antworten.children).forEach((node, i) => {

      if (i === frage.richtig) node.classList.add('btn--primary');
      else if (i === gewaehlt) node.classList.add('btn--danger');
    });

    setTimeout(() => {
      index += 1;
      zeige();
    }, 950);
  }

const BODEN = 150;

function createObstacleGame(onEnd) {
  const canvas = h('canvas', { width: 640, height: 220, style: { width: '100%', borderRadius: 'var(--r-lg)', touchAction: 'none' } });
  const info = h('p.muted.center', 'Tippen oder Leertaste zum Springen.');
  const host = h('div.col', h('h2.center', '🏃 Hindernislauf'), info, canvas);

  const pet = activePet();
  const art = pet ? species(pet.artId) : null;
  const farbe = art ? element(art.element).farbe : '#7c8cff';

  let hindernisse = [];
  let tempo = 5;
  let punkte = 0;
  let laeuft = true;
  let rafId = null;
  let naechstesHindernis = 60;

  function springen() {
    if (!laeuft) return;
    if (spieler.amBoden) {
      spieler.vy = SPRUNGKRAFT;
      spieler.amBoden = false;
    }
  }

  canvas.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    springen();

  const onKey = (event) => {
    if (event.code === 'Space' || event.code === 'ArrowUp') {
      event.preventDefault();
      springen();
    }

  document.addEventListener('keydown', onKey);

  function schleife() {
    if (!laeuft) return;

    // Spieler
    spieler.vy += SCHWERKRAFT;
    spieler.y += spieler.vy;
    if (spieler.y >= BODEN) {
      spieler.y = BODEN;
      spieler.vy = 0;
      spieler.amBoden = true;
    }

    // Hindernisse
    naechstesHindernis -= 1;
    if (naechstesHindernis <= 0) {
      const hoch = randFloat(24, 46);
      hindernisse.push({ x: canvas.width + 20, w: randFloat(16, 30), h: hoch });
      naechstesHindernis = Math.max(34, 90 - tempo * 3) + randFloat(0, 30);

    hindernisse.forEach((hindernis) => {
      hindernis.x -= tempo;
    });
    hindernisse = hindernisse.filter((hindernis) => hindernis.x + hindernis.w > -10);

      const tief = spieler.y + spieler.r > BODEN + 18 - hindernis.h;

__define("src/ui/minigames/memory.js", function(__exports, __require){
/**
 * memory.js — Memory mit Kreaturen.
 *
 * Acht Paare. Die Motive kommen aus der eigenen Sammlung, wenn sie groß genug
 * ist — dadurch fühlt sich das Spiel wie ein Teil des Fabelgartens an und
 * nicht wie ein beliebiges Beiwerk.
 */

const { h } = __require("src/core/util.js");
const { getState } = __require("src/core/state.js");
const { SPECIES, species } = __require("src/data/species.js");
const { shuffle, pickMany } = __require("src/core/rng.js");
const { spriteMarkup } = __require("src/render/petSprite.js");

const PAARE = 8;

function createMemoryGame(onEnd) {
  const motive = waehleMotive();
  const karten = shuffle([...motive, ...motive]).map((artId, index) => ({
    id: index,
    artId,
    offen: false,
    gefunden: false,
  }));

  let erste = null;
  let sperre = false;
  let zuege = 0;
  let gefunden = 0;

  const info = h('p.muted.center', 'Finde alle acht Paare.');
  const brett = h('div.grid', {
    style: { gridTemplateColumns: 'repeat(4, 1fr)', maxWidth: '460px', margin: '0 auto', width: '100%' },
  });

  const host = h('div.col', h('h2.center', '🃏 Memory'), info, brett);

  function zeichne() {
    brett.replaceChildren(
      ...karten.map((karte) => {
        const sichtbar = karte.offen || karte.gefunden;
        return h(
          'button.tile',
          {
            style: {
              aspectRatio: '1',
              padding: '4px',
              opacity: karte.gefunden ? '.55' : '1',
              background: sichtbar ? 'var(--surface)' : 'var(--surface-3)',
            },
            'aria-label': sichtbar ? species(karte.artId).name : 'Verdeckte Karte',
            onclick: () => aufdecken(karte),
          },
          sichtbar
            ? h('div.sprite', { style: { width: '100%', height: '100%' }, html: spriteMarkup({ artId: karte.artId }, { schatten: false, effekte: false }) })
            : h('span', { style: { fontSize: '1.8rem' } }, '❔')
        );
      })
    );
    info.textContent = `Züge: ${zuege} · Paare: ${gefunden}/${PAARE}`;
  }

  function aufdecken(karte) {
    if (sperre || karte.offen || karte.gefunden) return;
    karte.offen = true;

    if (!erste) {
      erste = karte;
      zeichne();
      return;
    }

    zuege += 1;
    zeichne();

    if (erste.artId === karte.artId) {
      erste.gefunden = true;
      karte.gefunden = true;
      erste = null;
      gefunden += 1;
      zeichne();
      if (gefunden === PAARE) setTimeout(beenden, 500);
      return;
    }

    sperre = true;
    setTimeout(() => {
      erste.offen = false;
      karte.offen = false;
      erste = null;
      sperre = false;
      zeichne();
    }, 800);
  }

  function beenden() {
    // Perfekt wären 8 Züge; alles unter 18 gilt als Sieg.
    const punkte = Math.max(5, Math.round(120 - (zuege - PAARE) * 6));
    onEnd({ punkte, gewonnen: zuege <= 18, detail: `${zuege} Züge` });
  }

  zeichne();
  return host;
}

/** Motive: bevorzugt entdeckte Arten, sonst die Starter und Grundformen. */
function waehleMotive() {
  const state = getState();
  const entdeckt = Object.keys(state.buch).filter((id) => state.buch[id]?.gefangen);

  if (entdeckt.length >= PAARE) return pickMany(entdeckt, PAARE);

  const auffuellen = SPECIES.filter((art) => art.stufe === 1).map((art) => art.id);
  return pickMany([...new Set([...entdeckt, ...auffuellen])], PAARE);
}

__exports["createMemoryGame"] = createMemoryGame;

      <stop offset="52%" stop-color="${p.haupt}"/>

const EYES = {
  rund: (k, p, ctx) => eyePair(k, p, ctx, 7, 7),
  gross: (k, p, ctx) => eyePair(k, p, ctx, 10, 11),
  schmal: (k, p, ctx) => eyePair(k, p, ctx, 8, 4.5),
  leuchtend: (k, p, ctx) => eyePair(k, p, ctx, 8, 8, true),
  facette: (k, p, ctx) => {
    const dx = k.r * 0.42;
    const face = (cx) =>
      path(
        `M${num(cx - 9)} ${num(k.y - 2)} q9 -12 18 0 q-9 14 -18 0 z`,
        `class="pet-eye" fill="${p.auge}" ${stroke(ctx, p, 1.6)}`
      ) + path(`M${num(cx - 5)} ${num(k.y - 3)} q5 -5 10 0`, `stroke="${p.licht}" stroke-width="1.6" fill="none"`);
    return face(k.x - dx) + face(k.x + dx);
  },
  geschlossen: (k, p) => {
    const dx = k.r * 0.42;
    const lid = (cx) =>
      path(`M${num(cx - 8)} ${num(k.y)} q8 7 16 0`, `stroke="${p.pupille}" stroke-width="2.6" fill="none" stroke-linecap="round"`);
    return lid(k.x - dx) + lid(k.x + dx);
  },
};

/**
 * Augenpaar: weiße Lederhaut, kräftige Iris, dunkle Pupille, ein Glanzpunkt.
 * Die Lederhaut bleibt immer weiß — nur so heben sich die Augen auch bei
 * gelben oder weißen Kreaturen deutlich vom Kopf ab.
 */
function eyePair(k, p, ctx, rx, ry, glow = false) {
  const dx = k.r * 0.42;
  const one = (cx) => {
    const glowRing = glow && ctx.d >= 1 ? ellipse(cx, k.y, rx + 4, ry + 4, `fill="${p.glanz}" opacity="0.35"`) : '';
    return (
      glowRing +
      ellipse(cx, k.y, rx, ry, `class="pet-eye" fill="#ffffff" ${stroke(ctx, p, 1.4)}`) +
      ellipse(cx, k.y + ry * 0.06, rx * 0.68, ry * 0.8, `class="pet-eye" fill="${p.iris}"`) +
      ellipse(cx, k.y + ry * 0.1, rx * 0.38, ry * 0.5, `class="pet-eye" fill="${p.pupille}"`) +
      circle(cx - rx * 0.3, k.y - ry * 0.36, Math.max(1.4, rx * 0.22), `fill="#ffffff" opacity="0.95"`)
    );
  };
  return one(k.x - dx) + one(k.x + dx);
}

function drawEyes(type, kopf, p, ctx) {
  return (EYES[type] || EYES.rund)(kopf, p, ctx);
}

/** Kleiner Mund — gibt dem Gesicht Ausdruck, abhängig von der Stimmung. */
function drawMouth(kopf, p, mood = 'normal') {
  const y = kopf.y + kopf.r * 0.42;
  if (mood === 'traurig') {
    return path(`M${num(kopf.x - 8)} ${num(y + 3)} q8 -7 16 0`, `stroke="${p.pupille}" stroke-width="2.2" fill="none" stroke-linecap="round"`);
  }
  if (mood === 'schlafend') {
    return path(`M${num(kopf.x - 5)} ${num(y)} q5 5 10 0`, `stroke="${p.pupille}" stroke-width="2" fill="none" stroke-linecap="round"`);
  }
  if (mood === 'begeistert') {
    return path(`M${num(kopf.x - 9)} ${num(y - 2)} q9 12 18 0 q-9 5 -18 0 z`, `fill="${p.pupille}" opacity="0.85"`);
  }
  return path(`M${num(kopf.x - 7)} ${num(y)} q7 6 14 0`, `stroke="${p.pupille}" stroke-width="2.2" fill="none" stroke-linecap="round"`);
}

function hexToRgb(hex) {

  const min = Math.min(rr, gg, bb);
  const delta = max - min;

  let h = 0;
  if (delta !== 0) {
    if (max === rr) h = ((gg - bb) / delta) % 6;
    else if (max === gg) h = (bb - rr) / delta + 2;

}

/**
 * reaction.js — Reaktionsspiel.
 *
 * Fünf Runden. Nach zufälliger Wartezeit wechselt die Fläche die Farbe; wer
 * schneller klickt, bekommt mehr Punkte. Zu frühes Klicken kostet eine Runde.
 */

const { h, replace } = __require("src/core/util.js");
const { randInt } = __require("src/core/rng.js");

const RUNDEN = 5;

/**
 * @param {(ergebnis:{punkte:number, gewonnen:boolean, detail:string})=>void} onEnd
 * @returns {HTMLElement}
 */
function createReactionGame(onEnd) {
  let runde = 0;
  let zeiten = [];
  let zustand = 'warten'; // warten | bereit | pause
  let startZeit = 0;
  let timer = null;

  const flaeche = h('button', {
    style: {
      width: '100%',
      minHeight: '260px',
      borderRadius: 'var(--r-lg)',
      background: 'var(--surface-2)',
      border: '2px solid var(--border)',
      fontSize: '1.3rem',
      fontWeight: '700',
      transition: 'background 120ms',
    },
  });

  const info = h('p.muted.center');
  const host = h('div.col', h('h2.center', '⚡ Reaktion'), info, flaeche);

  function setzeInfo() {
    replace(
      info,
      `Runde ${Math.min(runde + 1, RUNDEN)} von ${RUNDEN}` +
        (zeiten.length ? ` · Schnitt ${Math.round(zeiten.reduce((a, b) => a + b, 0) / zeiten.length)} ms` : '')
    );
  }

  function naechsteRunde() {
    if (runde >= RUNDEN) {
      beenden();
      return;
    }
    zustand = 'warten';
    flaeche.style.background = 'var(--surface-2)';
    flaeche.textContent = 'Warte auf das Signal …';
    setzeInfo();

    timer = setTimeout(() => {
      zustand = 'bereit';
      startZeit = performance.now();
      flaeche.style.background = 'var(--good)';
      flaeche.textContent = 'JETZT!';
    }, randInt(1200, 3400));
  }

  flaeche.addEventListener('click', () => {
    if (zustand === 'warten') {
      clearTimeout(timer);
      zeiten.push(900); // Fehlstart zählt als sehr langsame Runde
      runde += 1;
      flaeche.style.background = 'var(--bad)';
      flaeche.textContent = 'Zu früh!';
      setTimeout(naechsteRunde, 900);
      return;
    }
    if (zustand !== 'bereit') return;

    const zeit = Math.round(performance.now() - startZeit);
    zeiten.push(zeit);
    runde += 1;
    zustand = 'pause';
    flaeche.style.background = 'var(--surface-3)';
    flaeche.textContent = `${zeit} ms`;
    setTimeout(naechsteRunde, 700);
  });

    const schnitt = zeiten.reduce((a, b) => a + b, 0) / zeiten.length;

    const punkte = Math.max(0, Math.round((800 - schnitt) / 6));
    onEnd({
      punkte,
      gewonnen: schnitt < 480,
      detail: `Durchschnitt: ${Math.round(schnitt)} ms`,

  host.abbrechen = () => clearTimeout(timer);
  return host;
}

  if (pet.beduerfnisse.energie < 25) return { ok: false, grund: `${pet.name} ist zu erschöpft.` };
  if (pet.krank) return { ok: false, grund: `${pet.name} ist krank.` };

 *
 * Ein einziger `requestAnimationFrame`-Loop treibt alles an. Die Simulation
 * läuft in festen Sekundenschritten, damit Bedürfnisse unabhängig von der
 * Bildrate gleich schnell sinken. Ist der Tab im Hintergrund, pausiert der

 * (siehe `catchUp`).

const TICK_MS = 1000;

 * findet seine Haustiere hungrig vor — aber nicht am Boden zerstört. Das

const tickHandlers = new Set();
const frameHandlers = new Set();

 * Meldet eine Funktion an, die jede Spielsekunde läuft.
 * @param {(seconds:number, state:object)=>void} handler
 * @returns {Function} Abmelde-Funktion
 */
function onTick(handler) {
  tickHandlers.add(handler);
  return () => tickHandlers.delete(handler);
}

/**
 * Meldet eine Funktion an, die jedes Bild läuft (für weiche Anzeigen wie Timer).
 * @param {(dtMs:number)=>void} handler

  frameHandlers.add(handler);
  return () => frameHandlers.delete(handler);

  if (rafId) cancelAnimationFrame(rafId);

}

  lastFrame = now;

  for (const handler of frameHandlers) {
    try {
      handler(dt);

      console.error('Fehler im Bild-Handler:', error);

    const was = { futter: 'Futter', trank: 'Getränke', medizin: 'Medizin' }[def.braucht] || 'Gegenstände';
    return { ok: false, grund: `Du hast kein ${was} im Beutel.` };

 * Führt eine Aktion aus.

 * @param {string} petId

      ziel.abklingzeiten[actionId] = Date.now() + def.abklingzeit;

function performSleep(pet, options) {

  sleepPet(pet.id, stunden);

      ziel.aktionen.schlafen = (ziel.aktionen.schlafen || 0) + 1;
      ziel.gesamtAktionen += 1;

function performWithItem(def, pet, options) {

  const gewaehlt = options.itemId && hasItem(options.itemId) ? options.itemId : kandidaten[0]?.id;

  if (!ergebnis.ok) return ergebnis;

    const ziel = s.haustiere.find((entry) => entry.id === pet.id);
    if (ziel) {
      ziel.aktionen[def.id] = (ziel.aktionen[def.id] || 0) + 1;
      ziel.gesamtAktionen += 1;
      ziel.gefuehle.zuneigung = clamp(ziel.gefuehle.zuneigung + 1.5, 0, 100);

    s.statistik.aktionenGesamt += 1;

  const xp = def.xp || 0;
  if (xp) grantXp(pet.id, xp);

  emit(EVENTS.PET_ACTION, { actionId: def.id, petId: pet.id, effekte: ergebnis.effekte, xp, itemId: gewaehlt });
  return {
    ok: true,
    text: `${item(gewaehlt).name} — ${item(gewaehlt).icon}`,
    effekte: ergebnis.effekte,
    xp,
    animation: def.animation,
  };
}

/** Welches Attribut ein Training verbessert — Raumausstattung gibt den Ausschlag. */
function trainingsSchwerpunkt(pet, boni) {
  const gewichte = {
    staerke: 1 + (boni.staerkeTraining || 0),
    intelligenz: 1 + (boni.intelligenzTraining || 0),
    tempo: 1 + (boni.tempoTraining || 0),
  };
  // Die Persönlichkeit schiebt zusätzlich in ihre Richtung.
  const neigung = { mutig: 'staerke', intelligent: 'intelligenz', verspielt: 'tempo' }[pet.persoenlichkeit];

/** Kleiner Zufallsfund beim Spaziergang. */
function spaziergangFund() {

function spielzeugBonus(def) {
  if (!def.bonusSchluessel) return 1;
  const inv = getState().inventar;

  for (const itemId of Object.keys(inv)) {

  if (pet.krank) return 'medizin';
  if (pet.schlaeft) return null;
  const n = pet.beduerfnisse;
  if (n.hunger < 35) return 'fuettern';
  if (n.durst < 35) return 'traenken';
  if (n.energie < 25) return 'schlafen';
  if (n.sauberkeit < 35) return 'baden';
  if (pet.gefuehle.stimmung < 50) return 'spielen';
  return 'streicheln';

/** Wie lange die Standard-Schlafdauer ist (für die Anzeige). */
const SLEEP_HOURS = 3;
const SLEEP_MS = SLEEP_HOURS * 60 * MINUTE;

__exports["ACTION_ORDER"] = ACTION_ORDER;
__exports["needsItem"] = needsItem;
__exports["itemsForAction"] = itemsForAction;
__exports["cooldownLeft"] = cooldownLeft;
__exports["canPerform"] = canPerform;
__exports["performAction"] = performAction;
__exports["suggestedAction"] = suggestedAction;
__exports["SLEEP_HOURS"] = SLEEP_HOURS;
__exports["SLEEP_MS"] = SLEEP_MS;
