  <style>
/* ---- src/styles/base.css ---- */
/* ==========================================================================
   base.css — Reset, Design-Tokens, Themes, Grundtypografie
   ========================================================================== */

/* --- Reset ---------------------------------------------------------------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

* {
  margin: 0;
}

html,
body {
  height: 100%;
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  color: var(--text);
  background: var(--bg);
  overscroll-behavior: none;
}

img,
svg,
canvas {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}

/* --- Design-Tokens -------------------------------------------------------- */

:root {
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-display: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;

  /* Abstände (4-px-Raster) */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;
  --sp-7: 3rem;

  /* Radien */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* Bewegung */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 140ms;
  --t-med: 260ms;
  --t-slow: 460ms;

  /* Element-Farben (themeunabhängig, sie sind Teil der Spielidentität) */
  --el-feuer: #ff7a45;
  --el-wasser: #38b6ff;
  --el-natur: #4cc38a;
  --el-blitz: #ffc93c;
  --el-eis: #7fd8e8;
  --el-schatten: #8b6bd9;
  --el-licht: #ffd98e;
  --el-gestein: #b08968;
  --el-wind: #9ad9c8;
  --el-metall: #a9b4c2;
  --el-geist: #d67ab1;
  --el-kristall: #7ae5d0;

  /* Seltenheits-Farben */
  --ra-gewoehnlich: #b6bfcc;
  --ra-ungewoehnlich: #55c57a;
  --ra-selten: #4aa8ff;
  --ra-episch: #b072f5;
  --ra-legendaer: #ffc03a;
  --ra-mystisch: #ff5a7a;

  /* Bedürfnis-Farben */
  --stat-gesundheit: #ff6b7d;
  --stat-energie: #ffc93c;
  --stat-hunger: #ffa552;
  --stat-durst: #4aa8ff;
  --stat-sauberkeit: #7ae5d0;
  --stat-stimmung: #ff8fc7;

  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.14);
  --shadow-md: 0 6px 18px -6px rgb(0 0 0 / 0.28);
  --shadow-lg: 0 20px 48px -20px rgb(0 0 0 / 0.45);
}

/* --- Dunkles Theme (Standard) --------------------------------------------- */

:root,
:root[data-theme='dark'] {
  --bg: #0e1220;
  --bg-deep: #070a14;
  --surface: #171d31;
  --surface-2: #1f2740;
  --surface-3: #2a3350;
  --border: #2e3859;
  --border-soft: #232c47;

  --text: #eaeefb;
  --text-dim: #a7b1cd;
  --text-faint: #6f7a99;

  --brand: #7c8cff;
  --brand-strong: #9aa6ff;
  --brand-ink: #0e1220;
  --accent: #ffc93c;

  --good: #4cc38a;
  --warn: #ffb020;
  --bad: #ff6b7d;

  --focus: #9aa6ff;

  --scene-sky-1: #1b2144;
  --scene-sky-2: #2a2d5c;
  --scene-ground: #1d2a3f;
  --glass: rgb(255 255 255 / 0.06);
  --glass-line: rgb(255 255 255 / 0.09);
}

/* --- Helles Theme --------------------------------------------------------- */

:root[data-theme='light'] {
  --bg: #f3f5fb;
  --bg-deep: #e7ebf6;
  --surface: #ffffff;
  --surface-2: #f5f7fd;
  --surface-3: #e9eefa;
  --border: #d7deee;
  --border-soft: #e6ebf7;

  --text: #182034;
  --text-dim: #55617e;
  --text-faint: #8b95af;

  --brand: #5566f0;
  --brand-strong: #4353e0;
  --brand-ink: #ffffff;
  --accent: #f0a416;

  --good: #22a06b;
  --warn: #d98200;
  --bad: #e0455c;

  --focus: #4353e0;

  --scene-sky-1: #cfe3ff;
  --scene-sky-2: #eadcff;
  --scene-ground: #d5ecd8;
  --glass: rgb(18 24 40 / 0.04);
  --glass-line: rgb(18 24 40 / 0.08);

  --shadow-md: 0 6px 18px -8px rgb(30 45 90 / 0.22);
  --shadow-lg: 0 20px 48px -22px rgb(30 45 90 / 0.32);
}

/* --- Typografie ----------------------------------------------------------- */

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.01em;
}

h1 {
  font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem);
}
h2 {
  font-size: clamp(1.2rem, 1rem + 0.9vw, 1.55rem);
}
h3 {
  font-size: 1.05rem;
}

p {
  text-wrap: pretty;
}

.muted {
  color: var(--text-dim);
}
.faint {
  color: var(--text-faint);
}
.tiny {
  font-size: 0.78rem;
}
.small {
  font-size: 0.86rem;
}
.center {
  text-align: center;
}
.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* --- Ladebildschirm ------------------------------------------------------- */

.boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: var(--sp-4);
  background: var(--bg);
  z-index: 100;
}

.boot__mark {
  font-size: 3.5rem;
  animation: boot-pulse 1.4s var(--ease-out) infinite;
}

.boot__text {
  color: var(--text-dim);
}

@keyframes boot-pulse {
  0%,
  100% {
    transform: scale(1) rotate(-4deg);
    opacity: 0.7;
  }
  50% {
    transform: scale(1.14) rotate(4deg);
    opacity: 1;
  }
}

/* --- Scrollbars ----------------------------------------------------------- */

* {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: var(--r-pill);
  border: 3px solid transparent;
  background-clip: content-box;
}

/* ---- src/styles/layout.css ---- */
/* ==========================================================================
   layout.css — App-Gerüst, Navigation, Bildschirmraster, Responsivität
   ========================================================================== */

.app {
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    'topbar'
    'screen'
    'nav';
  background:
    radial-gradient(120% 80% at 12% -10%, var(--scene-sky-2) 0%, transparent 55%),
    radial-gradient(100% 70% at 90% 0%, var(--scene-sky-1) 0%, transparent 50%),
    var(--bg);
}

/* --- Kopfleiste ----------------------------------------------------------- */

.topbar {
  grid-area: topbar;
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  padding-top: max(var(--sp-3), env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.topbar__brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.topbar__brand span[aria-hidden] {
  font-size: 1.3rem;
}

.topbar__spacer {
  flex: 1;
}

.topbar__wallet {
  display: flex;
  gap: var(--sp-2);
}

/* --- Bildschirmfläche ----------------------------------------------------- */

.screen {
  grid-area: screen;
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding: var(--sp-4);
  padding-bottom: var(--sp-6);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  animation: screen-in var(--t-med) var(--ease-out);
}

.screen__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
}

.screen__title {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* --- Navigation ----------------------------------------------------------- */

.nav {
  grid-area: nav;
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  gap: var(--sp-1);
  padding: var(--sp-2);
  padding-bottom: max(var(--sp-2), env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border-soft);
}

.nav__item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--sp-2) var(--sp-1);
  border-radius: var(--r-md);
  color: var(--text-faint);
  font-size: 0.68rem;
  font-weight: 600;
  transition: color var(--t-fast), background var(--t-fast), transform var(--t-fast);
  position: relative;
}

.nav__item:hover {
  color: var(--text-dim);
  background: var(--glass);
}

.nav__item:active {
  transform: scale(0.94);
}

.nav__item[aria-current='page'] {
  color: var(--brand-strong);
  background: color-mix(in srgb, var(--brand) 16%, transparent);
}

.nav__icon {
  font-size: 1.25rem;
  line-height: 1;
}

.nav__badge {
  position: absolute;
  top: 4px;
  right: 50%;
  translate: 18px 0;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: var(--r-pill);
  background: var(--bad);
  color: #fff;
  font-size: 0.62rem;
  font-weight: 800;
  display: grid;
  place-items: center;
}

/* --- Desktop: Seitenleiste statt Bodenleiste ------------------------------ */

@media (min-width: 900px) {
  .app {
    grid-template-columns: 232px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      'nav topbar'
      'nav screen';
  }

  .nav {
    flex-direction: column;
    gap: 2px;
    padding: var(--sp-4) var(--sp-3);
    border-top: none;
    border-right: 1px solid var(--border-soft);
    overflow-y: auto;
    max-height: 100dvh;
    position: sticky;
    top: 0;
    bottom: auto;
  }

  .nav__item {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: var(--sp-3);
    padding: var(--sp-3);
    font-size: 0.92rem;
  }

  .nav__icon {
    font-size: 1.15rem;
    width: 1.4rem;
    text-align: center;
  }

  .nav__badge {
    position: static;
    translate: none;
    margin-left: auto;
  }

  .screen {
    padding: var(--sp-5);
  }
}

/* --- Raster --------------------------------------------------------------- */

.grid {
  display: grid;
  gap: var(--sp-3);
}

.grid--auto {
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}

.grid--wide {
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
}

.grid--tiles {
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
}

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

.row--tight {
  gap: var(--sp-1);
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.spread {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
}

/* --- Haupt-Bühne (Zuhause-Bildschirm) ------------------------------------- */

.stage {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1px solid var(--glass-line);
  background: linear-gradient(180deg, var(--scene-sky-1), var(--scene-sky-2) 62%, var(--scene-ground));
  min-height: clamp(260px, 42dvh, 380px);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-lg);
}

@media (min-width: 900px) {
  .home-layout {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: var(--sp-4);
    align-items: start;
  }
}

@keyframes screen-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---- src/styles/components.css ---- */
/* ==========================================================================
   components.css — Karten, Knöpfe, Leisten, Dialoge, Chips, Kacheln
   ========================================================================== */

/* --- Karten --------------------------------------------------------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-sm);
}

.card--flush {
  padding: 0;
  overflow: hidden;
}

.card--glass {
  background: var(--glass);
  border-color: var(--glass-line);
  backdrop-filter: blur(10px);
}

.card__title {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.section-label {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* --- Knöpfe --------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.62rem 1.05rem;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 650;
  font-size: 0.92rem;
  white-space: nowrap;
  transition: transform var(--t-fast) var(--ease-spring), background var(--t-fast),
    border-color var(--t-fast), opacity var(--t-fast);
}

.btn:hover:not(:disabled) {
  background: var(--surface-3);
  border-color: var(--brand);
}

.btn:active:not(:disabled) {
  transform: scale(0.95);
}

.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.btn--primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-strong));
  border-color: transparent;
  color: var(--brand-ink);
  box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--brand) 80%, transparent);
}

.btn--primary:hover:not(:disabled) {
  filter: brightness(1.08);
  background: linear-gradient(135deg, var(--brand), var(--brand-strong));
}

.btn--ghost {
  background: transparent;
  border-color: transparent;
}

.btn--ghost:hover:not(:disabled) {
  background: var(--glass);
  border-color: var(--glass-line);
}

.btn--danger {
  border-color: color-mix(in srgb, var(--bad) 55%, transparent);
  color: var(--bad);
}

.btn--danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--bad) 14%, transparent);
  border-color: var(--bad);
}

.btn--block {
  width: 100%;
}

.btn--sm {
  padding: 0.4rem 0.75rem;
  font-size: 0.82rem;
}

.btn--icon {
  padding: 0.5rem;
  aspect-ratio: 1;
  border-radius: var(--r-pill);
}

/* --- Aktionsknöpfe (Zuhause) ---------------------------------------------- */

.action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: var(--sp-2);
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: var(--sp-3) var(--sp-1);
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  font-size: 0.72rem;
  font-weight: 650;
  color: var(--text-dim);
  transition: transform var(--t-fast) var(--ease-spring), background var(--t-fast),
    color var(--t-fast), border-color var(--t-fast);
}

.action:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--text);
  border-color: var(--brand);
  transform: translateY(-2px);
}

.action:active:not(:disabled) {
  transform: scale(0.93);
}

.action:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.action__icon {
  font-size: 1.5rem;
  line-height: 1;
}

/* --- Chips & Abzeichen ---------------------------------------------------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0.22rem 0.62rem;
  border-radius: var(--r-pill);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  font-size: 0.76rem;
  font-weight: 650;
  white-space: nowrap;
}

.chip--wallet {
  background: var(--surface-2);
  border-color: var(--border-soft);
  font-variant-numeric: tabular-nums;
}

.chip--el {
  color: var(--el-color, var(--text));
  border-color: color-mix(in srgb, var(--el-color, var(--brand)) 40%, transparent);
  background: color-mix(in srgb, var(--el-color, var(--brand)) 14%, transparent);
}

.chip--rarity {
  color: var(--ra-color, var(--text));
  border-color: color-mix(in srgb, var(--ra-color, var(--brand)) 45%, transparent);
  background: color-mix(in srgb, var(--ra-color, var(--brand)) 15%, transparent);
}

/* Seltenheits-Farbe als Variable setzen (von JS über data-rarity gesetzt) */
[data-rarity='gewoehnlich'] { --ra-color: var(--ra-gewoehnlich); }
[data-rarity='ungewoehnlich'] { --ra-color: var(--ra-ungewoehnlich); }
[data-rarity='selten'] { --ra-color: var(--ra-selten); }
[data-rarity='episch'] { --ra-color: var(--ra-episch); }
[data-rarity='legendaer'] { --ra-color: var(--ra-legendaer); }
[data-rarity='mystisch'] { --ra-color: var(--ra-mystisch); }

[data-element='feuer'] { --el-color: var(--el-feuer); }
[data-element='wasser'] { --el-color: var(--el-wasser); }
[data-element='natur'] { --el-color: var(--el-natur); }
[data-element='blitz'] { --el-color: var(--el-blitz); }
[data-element='eis'] { --el-color: var(--el-eis); }
[data-element='schatten'] { --el-color: var(--el-schatten); }
[data-element='licht'] { --el-color: var(--el-licht); }
[data-element='gestein'] { --el-color: var(--el-gestein); }
[data-element='wind'] { --el-color: var(--el-wind); }
[data-element='metall'] { --el-color: var(--el-metall); }
[data-element='geist'] { --el-color: var(--el-geist); }
[data-element='kristall'] { --el-color: var(--el-kristall); }

/* --- Werteleisten --------------------------------------------------------- */

.stat {
  display: grid;
  grid-template-columns: 1.15rem 1fr auto;
  align-items: center;
  gap: var(--sp-2);
  font-size: 0.8rem;
}

.stat__icon {
  text-align: center;
}

.stat__track {
  height: 9px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
  position: relative;
}

.stat__fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--stat-color, var(--brand));
  transition: width var(--t-slow) var(--ease-out), background var(--t-med);
  position: relative;
}

.stat__fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgb(255 255 255 / 0.28), transparent 60%);
}

.stat__value {
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  min-width: 2.4rem;
  text-align: right;
}

.stat--low .stat__fill {
  animation: stat-warn 1.6s ease-in-out infinite;
}

/* Attributwerte (Stärke, Intelligenz …) */
.attr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
  gap: var(--sp-2);
}

.attr {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: var(--sp-2);
  text-align: center;
}

.attr__value {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.attr__label {
  font-size: 0.68rem;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* --- Fortschrittsbalken (XP, Brutzeit, Expedition) ------------------------ */

.progress {
  height: 7px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}

.progress__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand), var(--accent));
  border-radius: var(--r-pill);
  transition: width var(--t-slow) var(--ease-out);
}

/* --- Haustier-Karten ------------------------------------------------------ */

.pet-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  text-align: left;
  transition: transform var(--t-fast) var(--ease-spring), border-color var(--t-fast),
    box-shadow var(--t-fast);
  overflow: hidden;
}

.pet-card::before {
  content: '';
  position: absolute;
  inset: -40% 40% 60% -40%;
  background: radial-gradient(circle, color-mix(in srgb, var(--ra-color, var(--brand)) 40%, transparent), transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}

.pet-card:hover {
  transform: translateY(-3px);
  border-color: var(--ra-color, var(--brand));
  box-shadow: var(--shadow-md);
}

.pet-card--active {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 45%, transparent);
}

.pet-card__art {
  height: 92px;
  display: grid;
  place-items: center;
  position: relative;
}

.pet-card__name {
  font-weight: 700;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  gap: 4px;
}

.pet-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-1);
  font-size: 0.74rem;
  color: var(--text-faint);
}

.pet-card__fav {
  position: absolute;
  top: var(--sp-2);
  right: var(--sp-2);
  font-size: 0.9rem;
}

/* --- Sprite-Hülle --------------------------------------------------------- */

.sprite {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  position: relative;
}

.sprite svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.sprite--stage {
  width: min(62%, 260px);
  aspect-ratio: 1;
}

/* --- Item-Kacheln --------------------------------------------------------- */

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: var(--sp-3) var(--sp-2);
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  transition: transform var(--t-fast) var(--ease-spring), border-color var(--t-fast);
  text-align: center;
}

.tile:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: var(--ra-color, var(--brand));
}

.tile:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.tile__icon {
  font-size: 1.7rem;
  line-height: 1;
}

.tile__label {
  font-size: 0.72rem;
  font-weight: 650;
  line-height: 1.25;
}

.tile__count {
  position: absolute;
  top: 4px;
  right: 6px;
  font-size: 0.68rem;
  font-weight: 800;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.tile--locked {
  filter: grayscale(1);
  opacity: 0.5;
}

/* --- Dialoge -------------------------------------------------------------- */

.modal-root:empty {
  display: none;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: var(--sp-4);
  background: rgb(4 6 14 / 0.62);
  backdrop-filter: blur(6px);
  animation: fade-in var(--t-fast) ease-out;
}

.modal {
  width: min(560px, 100%);
  max-height: min(84dvh, 720px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-5);
  box-shadow: var(--shadow-lg);
  animation: modal-in var(--t-med) var(--ease-spring);
}

.modal__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.modal__body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.modal__foot {
  display: flex;
  gap: var(--sp-2);
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: var(--sp-4);
}

/* --- Hinweise (Toasts) ---------------------------------------------------- */

.toast-root {
  position: fixed;
  left: 50%;
  translate: -50% 0;
  bottom: calc(84px + env(safe-area-inset-bottom));
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  pointer-events: none;
  width: min(440px, calc(100% - 2rem));
}

@media (min-width: 900px) {
  .toast-root {
    bottom: var(--sp-5);
  }
}

.toast {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 0.6rem 1rem;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  font-size: 0.88rem;
  font-weight: 600;
  animation: toast-in var(--t-med) var(--ease-spring);
  max-width: 100%;
}

.toast--good {
  border-color: color-mix(in srgb, var(--good) 55%, transparent);
}
.toast--bad {
  border-color: color-mix(in srgb, var(--bad) 55%, transparent);
}
.toast--rare {
  border-color: var(--ra-legendaer);
  box-shadow: 0 0 24px -6px var(--ra-legendaer);
}

.toast--leaving {
  animation: toast-out var(--t-med) var(--ease-out) forwards;
}

/* --- Effekt-Ebene --------------------------------------------------------- */

.fx-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 80;
  overflow: hidden;
}

.fx-float {
  position: absolute;
  font-weight: 800;
  font-size: 1rem;
  text-shadow: 0 2px 6px rgb(0 0 0 / 0.45);
  animation: float-up 1.1s var(--ease-out) forwards;
  white-space: nowrap;
}

.fx-particle {
  position: absolute;
  font-size: 1.1rem;
  animation: particle-burst 0.9s var(--ease-out) forwards;
}

/* --- Reiter --------------------------------------------------------------- */

.tabs {
  display: flex;
  gap: var(--sp-1);
  padding: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-pill);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: 1 0 auto;
  padding: 0.42rem 0.9rem;
  border-radius: var(--r-pill);
  font-size: 0.84rem;
  font-weight: 650;
  color: var(--text-dim);
  white-space: nowrap;
  transition: background var(--t-fast), color var(--t-fast);
}

.tab[aria-selected='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* --- Formularelemente ----------------------------------------------------- */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.field__label {
  font-size: 0.8rem;
  font-weight: 650;
  color: var(--text-dim);
}

.input,
.select {
  padding: 0.55rem 0.8rem;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border);
  transition: border-color var(--t-fast);
  width: 100%;
}

.input:focus,
.select:focus {
  border-color: var(--brand);
  outline: none;
}

.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--border-soft);
  width: 100%;
  text-align: left;
}

.switch:last-child {
  border-bottom: none;
}

.switch__track {
  flex: none;
  width: 46px;
  height: 26px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--border);
  position: relative;
  transition: background var(--t-fast);
}

.switch__track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: transform var(--t-med) var(--ease-spring), background var(--t-fast);
}

.switch[aria-checked='true'] .switch__track {
  background: color-mix(in srgb, var(--brand) 45%, transparent);
  border-color: var(--brand);
}

.switch[aria-checked='true'] .switch__track::after {
  transform: translateX(20px);
  background: var(--brand-strong);
}

/* --- Leerzustände --------------------------------------------------------- */

.empty {
  display: grid;
  place-items: center;
  gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--text-faint);
}

.empty__icon {
  font-size: 2.5rem;
  opacity: 0.6;
}

/* --- Listeneinträge ------------------------------------------------------- */

.list-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  width: 100%;
  text-align: left;
}

.list-item__icon {
  font-size: 1.5rem;
  flex: none;
  width: 2rem;
  text-align: center;
}

.list-item__body {
  flex: 1;
  min-width: 0;
}

.list-item__title {
  font-weight: 650;
  font-size: 0.92rem;
}

.list-item--done {
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
  background: color-mix(in srgb, var(--good) 10%, var(--surface-2));
}

.list-item--locked {
  opacity: 0.55;
}

/* ---- src/styles/animations.css ---- */
/* ==========================================================================
   animations.css — Keyframes und Haustier-Animationszustände
   ==========================================================================
   Die Sprites (prozedural wie handgezeichnet) liefern immer dieselben
   Gruppen-Klassen: .pet-root, .pet-body, .pet-head, .pet-eye, .pet-tail,
   .pet-ear, .pet-wing, .pet-aura. Dadurch gelten diese Animationen für
   jede Kreatur, unabhängig von ihrer Herkunft.
   ========================================================================== */

/* --- Allgemeine Keyframes ------------------------------------------------- */

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes modal-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.94);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes toast-out {
  to {
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
  }
}

@keyframes float-up {
  0% {
    opacity: 0;
    transform: translateY(0) scale(0.7);
  }
  18% {
    opacity: 1;
    transform: translateY(-10px) scale(1.12);
  }
  100% {
    opacity: 0;
    transform: translateY(-72px) scale(1);
  }
}

@keyframes particle-burst {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(0.5) rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: translate(var(--dx, 0), var(--dy, -60px)) scale(1.15) rotate(var(--dr, 180deg));
  }
}

@keyframes stat-warn {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.55);
  }
}

@keyframes shimmer {
  0% {
    background-position: -180% 0;
  }
  100% {
    background-position: 180% 0;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin-slow {
  to {
    transform: rotate(360deg);
  }
}

/* --- Grundbewegung des Sprites -------------------------------------------- */

.pet-root {
  transform-box: fill-box;
  transform-origin: center bottom;
}

.sprite--animated .pet-root {
  animation: pet-breathe 3.4s ease-in-out infinite;
}

@keyframes pet-breathe {
  0%,
  100% {
    transform: scaleY(1) translateY(0);
  }
  50% {
    transform: scaleY(1.035) translateY(-1.5%);
  }
}

.sprite--animated .pet-tail {
  transform-box: fill-box;
  transform-origin: left center;
  animation: pet-tail 2.1s ease-in-out infinite;
}

@keyframes pet-tail {
  0%,
  100% {
    transform: rotate(-7deg);
  }
  50% {
    transform: rotate(9deg);
  }
}

.sprite--animated .pet-ear {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: pet-ear 4.2s ease-in-out infinite;
}

@keyframes pet-ear {
  0%,
  92%,
  100% {
    transform: rotate(0deg);
  }
  95% {
    transform: rotate(-8deg);
  }
}

.sprite--animated .pet-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-blink 5.2s ease-in-out infinite;
}

@keyframes pet-blink {
  0%,
  94%,
  100% {
    transform: scaleY(1);
  }
  96% {
    transform: scaleY(0.08);
  }
}

.sprite--animated .pet-wing {
  transform-box: fill-box;
  transform-origin: right center;
  animation: pet-wing 1.5s ease-in-out infinite;
}

@keyframes pet-wing {
  0%,
  100% {
    transform: rotate(0deg) scaleX(1);
  }
  50% {
    transform: rotate(-16deg) scaleX(0.88);
  }
}

.pet-aura {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-aura 4s ease-in-out infinite;
}

@keyframes pet-aura {
  0%,
  100% {
    opacity: 0.35;
    transform: scale(1);
  }
  50% {
    opacity: 0.7;
    transform: scale(1.07);
  }
}

.pet-orbit {
  transform-box: view-box;
  transform-origin: 50% 50%;
  animation: spin-slow 9s linear infinite;
}

.pet-float {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-float 3s ease-in-out infinite;
}

@keyframes pet-float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-4%);
  }
}

/* --- Zustände ------------------------------------------------------------- */

.sprite[data-mood='schlafend'] .pet-root {
  animation: pet-sleep 4.2s ease-in-out infinite;
}

.sprite[data-mood='schlafend'] .pet-eye {
  animation: none;
  transform: scaleY(0.1);
}

@keyframes pet-sleep {
  0%,
  100% {
    transform: scale(1, 0.98) translateY(1%) rotate(-1deg);
  }
  50% {
    transform: scale(1.02, 1.01) translateY(-0.5%) rotate(1deg);
  }
}

.sprite[data-mood='krank'] .pet-root {
  filter: saturate(0.5) brightness(0.88);
  animation: pet-sick 2.4s ease-in-out infinite;
}

@keyframes pet-sick {
  0%,
  100% {
    transform: translateY(0) rotate(0deg);
  }
  25% {
    transform: translateY(1.5%) rotate(-1.5deg);
  }
  75% {
    transform: translateY(1.5%) rotate(1.5deg);
  }
}

.sprite[data-mood='traurig'] .pet-root {
  animation: pet-sad 3.6s ease-in-out infinite;
}

@keyframes pet-sad {
  0%,
  100% {
    transform: translateY(2%) scaleY(0.97);
  }
  50% {
    transform: translateY(3%) scaleY(0.95);
  }
}

.sprite[data-mood='begeistert'] .pet-root {
  animation: pet-hop 0.85s var(--ease-spring) infinite;
}

@keyframes pet-hop {
  0%,
  100% {
    transform: translateY(0) scaleY(1);
  }
  30% {
    transform: translateY(-9%) scaleY(1.05);
  }
  55% {
    transform: translateY(0) scaleY(0.94);
  }
}

/* --- Einmalige Aktions-Animationen ---------------------------------------- */

.sprite--act-essen .pet-root {
  animation: act-eat 0.75s ease-in-out 2;
}

@keyframes act-eat {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  40% {
    transform: translateY(3%) rotate(-4deg) scaleY(0.94);
  }
  70% {
    transform: translateY(0) rotate(3deg);
  }
}

.sprite--act-spielen .pet-root {
  animation: act-play 0.6s var(--ease-spring) 3;
}

@keyframes act-play {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  25% {
    transform: translateY(-14%) rotate(-9deg);
  }
  60% {
    transform: translateY(-4%) rotate(8deg);
  }
}

.sprite--act-streicheln .pet-root {
  animation: act-pet 0.9s ease-in-out 2;
}

@keyframes act-pet {
  0%,
  100% {
    transform: rotate(0) scale(1);
  }
  30% {
    transform: rotate(-5deg) scale(1.04);
  }
  65% {
    transform: rotate(5deg) scale(1.04);
  }
}

.sprite--act-training .pet-root {
  animation: act-train 0.45s ease-in-out 4;
}

@keyframes act-train {
  0%,
  100% {
    transform: translateX(0);
  }
  30% {
    transform: translateX(-5%) scaleX(1.03);
  }
  70% {
    transform: translateX(5%) scaleX(0.97);
  }
}

.sprite--act-baden .pet-root {
  animation: act-bath 0.7s ease-in-out 3;
}

@keyframes act-bath {
  0%,
  100% {
    transform: rotate(0);
  }
  25% {
    transform: rotate(-12deg);
  }
  75% {
    transform: rotate(12deg);
  }
}

/* --- Entwicklung ---------------------------------------------------------- */

.evolve-stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 240px;
}

.evolve-stage .sprite {
  width: 200px;
  height: 200px;
}

.evolve-stage--flash .sprite {
  animation: evolve-flash 2.6s ease-in-out forwards;
}

@keyframes evolve-flash {
  0% {
    filter: brightness(1);
    transform: scale(1);
  }
  20% {
    filter: brightness(2.5) saturate(0);
    transform: scale(1.06);
  }
  40% {
    filter: brightness(1.2) saturate(0.4);
    transform: scale(0.96);
  }
  60% {
    filter: brightness(3) saturate(0);
    transform: scale(1.1);
  }
  100% {
    filter: brightness(1);
    transform: scale(1);
  }
}

.evolve-rays {
  position: absolute;
  inset: 0;
  background: conic-gradient(
    from 0deg,
    transparent 0deg 12deg,
    color-mix(in srgb, var(--accent) 55%, transparent) 14deg 18deg,
    transparent 20deg 32deg
  );
  border-radius: 50%;
  animation: spin-slow 6s linear infinite;
  opacity: 0.6;
  mask-image: radial-gradient(circle, transparent 28%, #000 70%);
}

/* --- Ei-Animationen ------------------------------------------------------- */

.egg-shake {
  animation: egg-shake 2.6s ease-in-out infinite;
  transform-origin: center bottom;
}

@keyframes egg-shake {
  0%,
  70%,
  100% {
    transform: rotate(0);
  }
  75% {
    transform: rotate(-9deg);
  }
  80% {
    transform: rotate(8deg);
  }
  85% {
    transform: rotate(-6deg);
  }
  90% {
    transform: rotate(4deg);
  }
}

/* --- Glanz-Effekt für seltene Karten -------------------------------------- */

.shine {
  position: relative;
  overflow: hidden;
}

.shine::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    110deg,
    transparent 35%,
    rgb(255 255 255 / 0.35) 48%,
    transparent 62%
  );
  background-size: 220% 100%;
  animation: shimmer 3.4s ease-in-out infinite;
  pointer-events: none;
}

/* --- Reduzierte Bewegung -------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* Manuell in den Einstellungen abschaltbar */
html[data-motion='reduced'] *,
html[data-motion='reduced'] *::before,
html[data-motion='reduced'] *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
}
